plugins {
    id 'com.android.application'
    id 'dagger.hilt.android.plugin'
    id 'androidx.navigation.safeargs'
    id "io.sentry.android.gradle" version "3.1.3"
}

android {
    dataBinding {
        enabled true
    }
    compileSdk 33

    defaultConfig {
        applicationId "com.darcangel.tcamViewer"
        minSdk 26
        targetSdk 32
        versionName "nameExt"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    defaultConfig {
        versionCode 1
        versionName "0.26"
//        externalNativeBuild {
//            cmake {
//                cppFlags '-O0 -ggdb'
//            }
//        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.debug
        }
        applicationVariants.all {
                // this method is use to rename your all apk whether
                // it may be signed or unsigned(debug apk)
            variant ->
                variant.outputs.each{
                        // on below line we are setting a name to our apk
                    output->
                        def buildType =  variant.buildType.name
                        // on below line we are specifying our app name.
                        project.ext { appName = 'tcamViewer' }
                        // on below line we are creating a new name for our apk.
                        def newName = output.outputFile.name
                        // on below line we are replacing our previous name with our app name.
                        newName = newName.replace("app_", "$project.ext.appName-")
                        // on below line we are replacing -debug with our formatted date.
                        newName = newName.replace("-" + buildType, "_" + buildType + "_" + "v" + versionName)
                        // at last we are setting our apk name to it.
                        output.outputFileName  = newName
                }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }


    buildFeatures {
        viewBinding true
        dataBinding true
    }

    hilt {
        enableAggregatingTask = true
    }
//    externalNativeBuild {
//        cmake {
//            path file('src/main/cpp/CMakeLists.txt')
//            version '3.18.1'
//        }
//    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.0'
    implementation 'com.google.android.material:material:1.8.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.navigation:navigation-fragment:2.5.3'
    implementation 'androidx.navigation:navigation-ui:2.5.3'
    implementation "androidx.navigation:navigation-dynamic-features-fragment:2.5.3"
    implementation 'androidx.databinding:databinding-ktx:7.4.0'
    implementation 'com.jakewharton.timber:timber:5.0.1'
    implementation 'com.google.dagger:hilt-android:2.44.2'
    implementation 'com.google.dagger:dagger:2.44.2'
    implementation 'com.google.code.gson:gson:2.10.1'
    implementation 'io.reactivex.rxjava3:rxandroid:3.0.2'
    implementation 'androidx.recyclerview:recyclerview-selection:1.1.0'
    implementation 'systems.manifold:manifold-ext:2022.1.34'
    implementation 'com.uber.rxdogtag2:rxdogtag:2.0.1'
    annotationProcessor 'com.google.dagger:hilt-compiler:2.44.2'
    implementation 'androidx.lifecycle:lifecycle-livedata-ktx:2.5.1'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.5.1'
    implementation 'androidx.recyclerview:recyclerview:1.2.1'
    implementation 'androidx.recyclerview:recyclerview-selection:1.1.0'
    implementation 'com.github.luizgrp:SectionedRecyclerViewAdapter:v3.2.0'
    implementation 'io.sentry:sentry-android:6.11.0'
    implementation 'androidx.viewpager2:viewpager2:1.0.0'
    implementation ('io.socket:socket.io-client:2.1.0') {
            exclude group: 'org.json', module: 'json'
        }
    compileOnly 'systems.manifold:manifold-preprocessor:2022.1.34'
    compileOnly 'systems.manifold:manifold-preprocessor-android-syms:2022.1.34'

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
}