plugins {
    id 'com.android.application'
    id 'dagger.hilt.android.plugin'
    id 'androidx.navigation.safeargs'
    id "io.sentry.android.gradle" version "3.13.0"
}

android {
    namespace "com.darcangel.tcamViewer"
    dataBinding {
        enabled true
    }
    compileSdk 33

    defaultConfig {
        applicationId "com.darcangel.tcamViewer"
        minSdk 26
        targetSdk 33
        versionName "nameExt"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    defaultConfig {
        versionCode 4022302
        versionName "1.0"
    }

    configurations.all {
        resolutionStrategy.force 'com.google.code.findbugs:jsr305:3.0.2'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }


    buildFeatures {
        viewBinding true
        dataBinding true
    }

    hilt {
        enableAggregatingTask = true
    }
}

dependencies {
    implementation 'org.jcodec:jcodec:0.2.5'
    implementation 'org.jcodec:jcodec-android:0.2.5'
    implementation 'org.jcodec:jcodec-streaming:0.2.3'
    constraints {
        implementation("org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.0") {
            because("kotlin-stdlib-jdk7 is now a part of kotlin-stdlib")
        }
        implementation("org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.0") {
            because("kotlin-stdlib-jdk8 is now a part of kotlin-stdlib")
        }
    }
    implementation 'com.github.f0ris.sweetalert:library:1.6.2'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.9.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.navigation:navigation-fragment:2.6.0'
    implementation 'androidx.navigation:navigation-ui:2.6.0'
    implementation "androidx.navigation:navigation-dynamic-features-fragment:2.6.0"
    implementation 'androidx.databinding:databinding-ktx:8.0.2'
    implementation 'com.jakewharton.timber:timber:5.0.1'
    implementation 'com.google.dagger:hilt-android:2.44.2'
    implementation 'com.google.dagger:dagger:2.44.2'
    implementation 'com.google.code.gson:gson:2.10.1'
    implementation 'io.reactivex.rxjava3:rxandroid:3.0.2'
    implementation 'androidx.recyclerview:recyclerview-selection:1.1.0'
    implementation 'systems.manifold:manifold-ext:2022.1.34'
    implementation 'com.uber.rxdogtag2:rxdogtag:2.0.1'
    annotationProcessor 'com.google.dagger:hilt-compiler:2.44.2'
    implementation 'androidx.lifecycle:lifecycle-livedata-ktx:2.6.1'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.6.1'
    implementation 'androidx.recyclerview:recyclerview:1.3.0'
    implementation 'androidx.recyclerview:recyclerview-selection:1.1.0'
    implementation 'com.github.luizgrp:SectionedRecyclerViewAdapter:v3.2.0'
    implementation 'io.sentry:sentry-android:6.15.0'
    implementation 'androidx.viewpager2:viewpager2:1.0.0'
    implementation 'androidx.leanback:leanback:1.0.0'
    implementation 'androidx.media3:media3-exoplayer:1.0.2'
    implementation 'androidx.media3:media3-exoplayer-dash:1.0.2'
    implementation 'androidx.media3:media3-ui:1.0.2'
    implementation "androidx.media3:media3-exoplayer-dash:1.0.2"
    implementation ('io.socket:socket.io-client:2.1.0') {
            exclude group: 'org.json', module: 'json'
        }
    compileOnly 'systems.manifold:manifold-preprocessor:2022.1.34'
    compileOnly 'systems.manifold:manifold-preprocessor-android-syms:2022.1.34'

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'

    /////debugImplementation 'com.squareup.leakcanary:leakcanary-android:2.8.1'
}